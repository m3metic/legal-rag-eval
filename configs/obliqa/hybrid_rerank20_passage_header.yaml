name: obliqa_hybrid_rerank20_passage_header
dataset: {name: obliqa, eval: {split: test}}
chunking: {strategy: passage_header}
retriever:
  type: rerank
  model: BAAI/bge-reranker-base
  candidates: 20
  base:
    type: hybrid
    retrievers:
      - {type: bm25}
      - {type: dense, model: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}
breakdown_by: n_passages
