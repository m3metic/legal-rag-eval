name: maud_hybrid_window200
dataset: {name: maud, eval: {query_mode: question}}
chunking: {strategy: window, size: 200, overlap: 50}
retriever:
  type: hybrid
  retrievers:
    - {type: bm25}
    - {type: dense, model: BAAI/bge-small-en-v1.5, query_prefix: "Represent this sentence for searching relevant passages: "}
breakdown_by: deal_point
